<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER HOST VIP KEY</title>
    <style>
        body {
            background-color: #030712;
            color: #00F0FF;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #0C101D;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #00F0FF;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
        .btn {
            background-color: #00F0FF;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .btn:disabled {
            background-color: #334155;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .ad-box {
            background-color: #111827;
            border: 1px dashed #00F0FF;
            padding: 20px 10px;
            margin: 15px 0;
            border-radius: 10px;
            color: #9ca3af;
            font-size: 13px;
        }
        .key-box {
            margin-top: 15px;
            padding: 12px;
            background: #052E16;
            border: 1px solid #00FF66;
            color: #00FF66;
            font-weight: bold;
            display: none;
            font-size: 16px;
            border-radius: 8px;
            user-select: all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0;">🔑 ГИРИФТАНИ КАЛИДИ VIP</h2>
    <p style="font-size: 12px; color: #9ca3af;">Барои гирифтани калиди ройгон 15 сония интизор шавед ва рекламаро бубинед!</p>

    <div class="ad-box">
        📢 <b>ҶОИ РЕКЛАМАИ ШУМО</b>
    </div>

    <button id="getKeyBtn" class="btn" disabled>⏳ ИНТИЗОР ШАВЕД (15)...</button>

    <div id="keyDisplay" class="key-box"></div>
</div>

<script>
    let timeLeft = 15;
    const btn = document.getElementById('getKeyBtn');
    const keyDisplay = document.getElementById('keyDisplay');
    const myKey = "CYBER-FREE-2026";

    const timer = setInterval(() => {
        timeLeft--;
        btn.innerText = `⏳ ИНТИЗОР ШАВЕД (${timeLeft})...`;
        
        if (timeLeft <= 0) {
            clearInterval(timer);
            btn.innerText = "🎁 ГИРИФТАНИ КАЛИД";
            btn.disabled = false;
        }
    }, 1000);

    btn.addEventListener('click', () => {
        keyDisplay.innerText = myKey;
        keyDisplay.style.display = "block";
        btn.style.display = "none";
    });
</script>

</body>
</html>
