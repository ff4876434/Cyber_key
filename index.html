<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER VIP KEY GENERATOR</title>

    <style>
        body {
            background-color: #030712;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #0C101D;
            border: 2px solid #00F0FF;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 360px;
            width: 90%;
        }

        h2 {
            color: #00F0FF;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00F0FF;
        }

        p {
            color: #64748B;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .timer-box {
            background: #030712;
            border: 1.5px dashed #00FF66;
            color: #00FF66;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #00FF66;
        }

        .btn-telegram {
            background: #24A1DE;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(36, 161, 222, 0.5);
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        .btn-telegram:disabled {
            background: #334155;
            color: #94A3B8;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>CYBER HOST VIP</h2>
        <p>СИСТЕМАИ ГИРИФТАНИ КАЛИД ДАР TELEGRAM</p>

        <!-- ТАЙМЕР -->
        <div id="timerDisplay" class="timer-box">⏳ ИНТИЗОР ШАВЕД: 30s</div>

        <!-- ТУГМАИ ГУЗАРИШ БА БОТ -->
        <button id="tgBtn" onclick="goToBot()" class="btn-telegram" disabled>⏳ ИНТИЗОРИИ 30 СОНИЯ...</button>
    </div>

    <script>
        // ЮЗЕРНЕЙМИ БОТИ ХУДРО ИНҶО БАҶОИ 'cyber_bot' БЕНАВИСЕД (БЕ @)
        const BOT_USERNAME = "CYBER_HOST_BOT"; 

        let timeLeft = 30;
        const timerDisplay = document.getElementById("timerDisplay");
        const tgBtn = document.getElementById("tgBtn");

        // Оғози таймери 30-сониягӣ
        const timer = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = "⏳ ИНТИЗОР ШАВЕД: " + timeLeft + "s";
            tgBtn.innerText = "⏳ ИНТИЗОРИИ " + timeLeft + " СОНИЯ...";

            if (timeLeft <= 0) {
                clearInterval(timer);
                timerDisplay.innerText = "✅ ТАМАМ ШУД!";
                tgBtn.innerText = "✈️ ГИРИФТАНИ КАЛИД ДАР TELEGRAM";
                tgBtn.disabled = false;
            }
        }, 1000);

        function goToBot() {
            // Гузариш ба бот бо параметри from_website
            window.location.href = `https://t.me/${BOT_USERNAME}?start=from_website`;
        }
    </script>
</body>
</html>
