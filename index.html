<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER VIP KEY GENERATOR</title>

    <!-- ПАЙВАСТ КАРДАНИ FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            background-color: #030712;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #0C101D;
            border: 2px solid #00F0FF;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 360px;
            width: 90%;
        }

        h2 {
            color: #00F0FF;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00F0FF;
        }

        p {
            color: #64748B;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .key-box {
            background: #030712;
            border: 1.5px dashed #00FF66;
            color: #00FF66;
            font-size: 16px;
            font-weight: bold;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            word-break: break-all;
            text-shadow: 0 0 5px #00FF66;
        }

        .btn-get {
            background: #00F0FF;
            color: #000;
            border: none;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .btn-get:disabled {
            background: #334155;
            color: #94A3B8;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>CYBER HOST VIP</h2>
        <p>СИСТЕМАИ ГИРИФТАНИ КАЛИДҲОИ ТАСОДУФӢ</p>

        <!-- БЛОКИ НИШОН ДОДАНИ КАЛИД Ё ТАЙМЕР -->
        <div id="keyDisplay" class="key-box">⏳ ИНТИЗОР ШАВЕД: 30s</div>

        <!-- ТУГМАИ ГИРИФТАНИ КАЛИД (АВВАЛ ҒАЙРИФАЪОЛ АСТ) -->
        <button id="mainBtn" onclick="getUniqueKeyForUser()" class="btn-get" disabled>⏳ ИНТИЗОРИИ 30 СОНИЯ...</button>
    </div>

    <script>
        // 1. ТАНЗИМИ FIREBASE
        const firebaseConfig = {
            databaseURL: "https://cyberhostvip-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // 2. ТАЙМЕРИ 30-СОНИЯГӢ
        let timeLeft = 30; // ТАРЗИ ДУРУСТИ 30 СОНИЯ
        const keyDisplay = document.getElementById("keyDisplay");
        const mainBtn = document.getElementById("mainBtn");

        // Санҷиш: Агар корбар аллакай калид гирифта бошад, таймерро намемонем
        const savedKey = localStorage.getItem("user_generated_key");
        if (savedKey) {
            keyDisplay.innerText = savedKey;
            mainBtn.innerText = "🔑 КАЛИДИ ШУМО ОМОДА АСТ";
            mainBtn.disabled = false;
        } else {
            // Оғози таймер
            const timer = setInterval(() => {
                timeLeft--;
                keyDisplay.innerText = "⏳ ИНТИЗОР ШАВЕД: " + timeLeft + "s";
                mainBtn.innerText = "⏳ ИНТИЗОРИИ " + timeLeft + " СОНИЯ...";

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    keyDisplay.innerText = "🔑 KEY: ---------------";
                    mainBtn.innerText = "⚡ ГИРИФТАНИ КАЛИД";
                    mainBtn.disabled = false; // Фаъол кардани тугма пас аз 30 сония
                }
            }, 1000);
        }

        // 3. ФУНКСИЯИ ГИРИФТАНИ КАЛИДИ ТАСОДУФӢ
        function getUniqueKeyForUser() {
            const currentSaved = localStorage.getItem("user_generated_key");
            if (currentSaved) {
                keyDisplay.innerText = currentSaved;
                alert("⚠️ Шумо аллакай калид гирифтаед!\n\nКалиди шумо: " + currentSaved);
                return;
            }

            db.ref('keys').once('value').then((snapshot) => {
                const keysData = snapshot.val();
                if (!keysData) {
                    alert("❌ Ҳеҷ калиде дар база ёфт нашуд!");
                    return;
                }

                const availableKeys = [];
                Object.keys(keysData).forEach((key) => {
                    const item = keysData[key];
                    if (item.status === 'active' && (!item.hwid || item.hwid === '')) {
                        availableKeys.push(key);
                    }
                });

                if (availableKeys.length === 0) {
                    alert("⚠️ Ҳоло калиди озод нест! Лутфан баъдтар кӯшиш кунед.");
                    return;
                }

                const randomIndex = Math.floor(Math.random() * availableKeys.length);
                const selectedKey = availableKeys[randomIndex];

                localStorage.setItem("user_generated_key", selectedKey);

                keyDisplay.innerText = selectedKey;
                alert("✅ Калиди тасодуфии шумо:\n\n" + selectedKey);

            }).catch((error) => {
                console.error("Хатогӣ:", error);
                alert("⚠️ Хатогии пайвастшавӣ ба база!");
            });
        }
    </script>
</body>
</html>
