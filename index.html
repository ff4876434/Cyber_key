<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER HOST VIP KEY</title>
    <style>
        body {
            background-color: #030712;
            color: #00F0FF;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #0C101D;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #00F0FF;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
        .btn {
            background-color: #00F0FF;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .btn:disabled {
            background-color: #1e293b;
            color: #64748b;
            cursor: not-allowed;
            border: 1px solid #334155;
        }
        .ad-box {
            background-color: #111827;
            border: 1px dashed #00F0FF;
            padding: 15px 10px;
            margin: 15px 0;
            border-radius: 10px;
            color: #9ca3af;
            font-size: 13px;
        }
        .step-badge {
            background: #1e293b;
            color: #00F0FF;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .error-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 8px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0;">🔑 ГИРИФТАНИ КАЛИДИ VIP</h2>
    <div id="stepBadge" class="step-badge">Марҳилаи 1 аз 3</div>
    
    <p id="instructionText" style="font-size: 12px; color: #9ca3af;">Барои гузаштан ба марҳилаи баъдӣ рекламаро дида, 15 сония интизор шавед.</p>
    <div id="netError" class="error-msg">⚠️ Пайвасти интернет қатъ шуд!</div>

    <div class="ad-box">
        📢 <b>ҶОИ РЕКЛАМАИ ШУМО (Monetag / Adsterra)</b>
    </div>

    <button id="btn1" class="btn">▶ РЕКЛАМАИ 1 (15 сек)</button>
    <button id="btn2" class="btn" style="display:none;" disabled>🔒 РЕКЛАМАИ 2 (15 сек)</button>
    <button id="btn3" class="btn" style="display:none;" disabled>🔒 РЕКЛАМАИ 3 (15 сек)</button>
    
    <!-- ЛИНКИ БОТИ АСЛИИ ТЕЛЕГРАМИ ШУМО -->
    <a id="btnTelegram" href="https://t.me/cyber_host_2026_bot?start=from_website" target="_blank" class="btn" style="display:none; background-color: #00FF66; color: #000;">✈️ ГИРИФТАНИ КАЛИД ДАР TELEGRAM</a>
</div>

<script>
    const directLinkAd = "https://example.com"; // Линки рекламаро оянда инҷо мемонед

    function startTimer(button, nextStepFunction, originalText) {
        if (!navigator.onLine) {
            alert("Лутфан пайвасти интернетро фаъол кунед!");
            return;
        }

        let timeLeft = 15;
        button.disabled = true;
        document.getElementById('netError').style.display = "none";
        
        if (directLinkAd !== "https://example.com") {
            window.open(directLinkAd, '_blank');
        }

        const timer = setInterval(() => {
            if (!navigator.onLine) {
                clearInterval(timer);
                button.disabled = false;
                button.innerText = originalText;
                document.getElementById('netError').style.display = "block";
                return;
            }

            timeLeft--;
            button.innerText = `⏳ ИНТИЗОР ШАВЕД (${timeLeft}s)...`;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                nextStepFunction();
            }
        }, 1000);
    }

    // Марҳилаи 1
    document.getElementById('btn1').addEventListener('click', function() {
        startTimer(this, () => {
            this.style.display = "none";
            const b2 = document.getElementById('btn2');
            b2.style.display = "block";
            b2.disabled = false;
            b2.innerText = "▶ РЕКЛАМАИ 2 (15 сек)";
            document.getElementById('stepBadge').innerText = "Марҳилаи 2 аз 3";
        }, "▶ РЕКЛАМАИ 1 (15 сек)");
    });

    // Марҳилаи 2
    document.getElementById('btn2').addEventListener('click', function() {
        startTimer(this, () => {
            this.style.display = "none";
            const b3 = document.getElementById('btn3');
            b3.style.display = "block";
            b3.disabled = false;
            b3.innerText = "▶ РЕКЛАМАИ 3 (15 сек)";
            document.getElementById('stepBadge').innerText = "Марҳилаи 3 аз 3";
        }, "▶ РЕКЛАМАИ 2 (15 сек)");
    });

    // Марҳилаи 3
    document.getElementById('btn3').addEventListener('click', function() {
        startTimer(this, () => {
            this.style.display = "none";
            document.getElementById('stepBadge').innerText = "Муваффақият!";
            document.getElementById('instructionText').innerText = "Рекламаҳо ба охир расиданд! Калидро дар Telegram гиред:";
            document.getElementById('btnTelegram').style.display = "inline-block";
        }, "▶ РЕКЛАМАИ 3 (15 сек)");
    });
</script>

</body>
</html>
