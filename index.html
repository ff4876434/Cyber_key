<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER VIP KEY GENERATOR</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            background-color: #030712;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        .card {
            background: #0C101D;
            border: 2px solid #00F0FF;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            max-width: 380px;
            width: 100%;
        }

        h2 {
            color: #00F0FF;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00F0FF;
        }

        p {
            color: #64748B;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .ad-container {
            background: #1e293b;
            border: 1px dashed #64748B;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94A3B8;
            font-size: 12px;
        }

        .key-box {
            background: #030712;
            border: 1.5px dashed #00FF66;
            color: #00FF66;
            font-size: 16px;
            font-weight: bold;
            padding: 14px;
            border-radius: 12px;
            margin: 15px 0;
            word-break: break-all;
            text-shadow: 0 0 5px #00FF66;
            user-select: all;
        }

        .btn-get {
            background: #00F0FF;
            color: #000;
            border: none;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .btn-get:disabled {
            background: #334155;
            color: #94A3B8;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>CYBER HOST VIP</h2>
        <p>СИСТЕМАИ ГИРИФТАНИ КАЛИДИ VIP</p>

        <div class="ad-container">
            📢 РЕКЛАМАИ БОЛОИ (КОДИ ADSTERRA)
        </div>

        <div id="keyDisplay" class="key-box">⏳ ИНТИЗОР ШАВЕД...</div>

        <div class="ad-container">
            📢 РЕКЛАМАИ ПАЁНИ (КОДИ ADSTERRA)
        </div>

        <button id="mainBtn" onclick="getKeyDirectly()" class="btn-get" disabled>⏳ ИНТИЗОРИИ СОНИЯҲО...</button>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://cyberhostvip-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const keyDisplay = document.getElementById("keyDisplay");
        const mainBtn = document.getElementById("mainBtn");

        const localKey = localStorage.getItem("cyber_vip_key");

        if (localKey) {
            keyDisplay.innerText = localKey;
            mainBtn.innerText = "🔑 КАЛИДИ ШУМО ОМОДА АСТ";
            mainBtn.disabled = false;
        } else {
            initTimer();
        }

        function initTimer() {
            // Мӯҳлати таймер 30 сония
            const DURATION = 30 * 1000; 
            let targetTime = localStorage.getItem("cyber_target_time");

            // Агар интернет хомӯш бошад ё бори аввал бошад, вақтро аз нав месозем
            if (!navigator.onLine) {
                showOfflineState();
                return;
            }

            if (!targetTime) {
                targetTime = Date.now() + DURATION;
                localStorage.setItem("cyber_target_time", targetTime);
            } else {
                targetTime = parseInt(targetTime);
            }

            const timer = setInterval(() => {
                // Агар ҳангоми сонияшуморӣ интернет хомӯш шавад
                if (!navigator.onLine) {
                    clearInterval(timer);
                    showOfflineState();
                    return;
                }

                const now = Date.now();
                const timeLeft = Math.ceil((targetTime - now) / 1000);

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    localStorage.removeItem("cyber_target_time");
                    keyDisplay.innerText = "🔑 KEY: ---------------";
                    mainBtn.innerText = "⚡ ГИРИФТАНИ КАЛИД";
                    mainBtn.disabled = false;
                } else {
                    keyDisplay.innerText = "⏳ ИНТИЗОР ШАВЕД: " + timeLeft + "s";
                    mainBtn.innerText = "⏳ ИНТИЗОРИИ " + timeLeft + " СОНИЯ...";
                }
            }, 500);
        }

        function showOfflineState() {
            keyDisplay.innerText = "❌ ИНТЕРНЕТ ФАЪОЛ НЕСТ!";
            mainBtn.innerText = "⚠️ ИНТЕРНЕТРО ФАЪОЛ КУНЕД";
            mainBtn.disabled = true;
        }

        // Вақте интернет дубора пайваст мешавад, таймер аз нав кунуни мешавад
        window.addEventListener('online', () => {
            if (!localStorage.getItem("cyber_vip_key")) {
                // Тоза кардани вақти кӯҳна, то ки таймер аз 30 сония аз нав сар шавад
                localStorage.removeItem("cyber_target_time");
                initTimer();
            }
        });

        window.addEventListener('offline', () => {
            if (!localStorage.getItem("cyber_vip_key")) {
                showOfflineState();
            }
        });

        // Функсияи гирифтани калид аз Firebase
        function getKeyDirectly() {
            const saved = localStorage.getItem("cyber_vip_key");
            if (saved) {
                keyDisplay.innerText = saved;
                alert("⚠️ Шумо аллакай калид гирифтаед:\n\n" + saved);
                return;
            }

            if (!navigator.onLine) {
                alert("❌ Интернет фаъол нест! Лутфан интернетро пайваст кунед.");
                showOfflineState();
                return;
            }

            mainBtn.innerText = "⏳ ДАР ҲОЛИ ОМОДАСОЗӢ...";
            mainBtn.disabled = true;

            db.ref('keys').once('value').then((snapshot) => {
                const keysData = snapshot.val();
                if (!keysData) {
                    alert("❌ Ҳеҷ калиде дар база ёфт нашуд!");
                    mainBtn.innerText = "⚡ ГИРИФТАНИ КАЛИД";
                    mainBtn.disabled = false;
                    return;
                }

                const availableKeys = [];
                Object.keys(keysData).forEach((k) => {
                    if (keysData[k].status === 'active' && (!keysData[k].hwid || keysData[k].hwid === '')) {
                        availableKeys.push(k);
                    }
                });

                if (availableKeys.length === 0) {
                    alert("⚠️ Ҳоло калиди озод нест!");
                    mainBtn.innerText = "⚡ ГИРИФТАНИ КАЛИД";
                    mainBtn.disabled = false;
                    return;
                }

                const randomKey = availableKeys[Math.floor(Math.random() * availableKeys.length)];
                localStorage.setItem("cyber_vip_key", randomKey);

                // Тоза кардани вақти таймер баъди гирифтани калид
                localStorage.removeItem("cyber_target_time");

                keyDisplay.innerText = randomKey;
                mainBtn.innerText = "✅ КАЛИД ГИРИФТА ШУД";
                alert("✅ Калиди шумо омода шуд:\n\n" + randomKey);

            }).catch((err) => {
                console.error(err);
                alert("❌ Хатогӣ дар пайвастшавӣ ба база!");
                mainBtn.innerText = "⚡ ГИРИФТАНИ КАЛИД";
                mainBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
